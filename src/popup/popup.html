<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>M2 Authenticator</title>
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body class="popup">

<!-- Vault chưa tạo -->
<section id="screenSetup" class="screen screen--center" hidden>
    <div class="brand">
        <img src="../assets/icons/icon48.png" alt="" width="40" height="40" />
        <h1>M2 Authenticator</h1>
    </div>
    <p class="screen__lead">Tạo master password để bắt đầu. Toàn bộ mã 2FA sẽ được mã hoá bằng khoá dẫn xuất từ mật khẩu này.</p>
    <button id="goSetup" class="btn btn--primary btn--block" type="button">Thiết lập ngay</button>
</section>

<!-- Vault đang khoá -->
<section id="screenLocked" class="screen screen--center" hidden>
    <div class="brand">
        <img src="../assets/icons/icon48.png" alt="" width="40" height="40" />
        <h1>Đang khoá</h1>
    </div>

    <div id="lockedAlert" class="alert alert--error" hidden></div>

    <form id="unlockForm" class="unlock-form" autocomplete="off">
        <label class="visually-hidden" for="masterPassword">Master password</label>
        <input id="masterPassword" class="input" type="password" placeholder="Master password"
               autocomplete="current-password" required />
        <button id="unlockBtn" class="btn btn--primary btn--block" type="submit">Mở khoá</button>
    </form>

    <button id="biometricBtn" class="btn btn--block" type="button" hidden>
        Mở khoá bằng vân tay
    </button>
</section>

<!-- Vault đã mở -->
<section id="screenVault" class="screen" hidden>
    <header class="topbar">
        <input id="search" class="input search" type="search" placeholder="Tìm account..." autocomplete="off" />
        <button id="addBtn" class="btn btn--icon" type="button" title="Thêm account">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
            </svg>
        </button>
        <button id="sortBtn" class="btn btn--icon" type="button" title="Sắp xếp">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h16M4 12h10M4 17h6" />
            </svg>
        </button>
        <button id="settingsBtn" class="btn btn--icon" type="button" title="Cài đặt">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
        </button>
        <button id="lockBtn" class="btn btn--icon" type="button" title="Khoá lại">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 aria-hidden="true">
                <rect x="4" y="11" width="16" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
        </button>
    </header>

    <div id="legacyBanner" class="alert alert--warning" hidden></div>

    <div id="list" class="list" role="list"></div>

    <div id="emptyState" class="empty" hidden>
        <p class="empty__title">Chưa có account nào</p>
        <p class="empty__text">Nhập một lần cả danh sách bằng QR "Chuyển tài khoản" của Google Authenticator.</p>
        <button id="emptyAddBtn" class="btn btn--primary" type="button">Thêm account</button>
    </div>
</section>

<script type="module" src="popup.js"></script>
</body>
</html>
