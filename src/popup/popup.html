<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>M2 Authenticator</title>
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="../settings/settings.css" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body class="popup">

<!-- Vault đang khoá: khung mở khoá dựng từ unlock/unlock-view.js, y hệt cửa sổ unlock -->
<section id="screenLocked" class="screen screen--center" hidden></section>

<!-- Vault đã mở -->
<section id="screenVault" class="screen" hidden>
    <header class="topbar">
        <input id="search" class="input search" type="search" data-i18n-placeholder="popup.search" autocomplete="off" />
        <h2 id="settingsTitle" class="topbar__title" data-i18n="options.title" hidden></h2>
        <button id="addBtn" class="btn btn--icon" type="button" data-i18n-title="popup.action.add" data-i18n-label="popup.action.add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
            </svg>
        </button>
        <button id="sortBtn" class="btn btn--icon" type="button" data-i18n-title="popup.action.sort" data-i18n-label="popup.action.sort">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h16M4 12h10M4 17h6" />
            </svg>
        </button>
        <button id="settingsBtn" class="btn btn--icon" type="button" aria-pressed="false"
                data-i18n-title="popup.action.settings" data-i18n-label="popup.action.settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
        </button>
        <button id="lockBtn" class="btn btn--icon" type="button" data-i18n-title="popup.action.lock" data-i18n-label="popup.action.lock">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 aria-hidden="true">
                <rect x="4" y="11" width="16" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
        </button>
    </header>

    <div id="list" class="list" role="list"></div>

    <div id="emptyState" class="empty" hidden>
        <p class="empty__title" data-i18n="popup.empty.title"></p>
        <p class="empty__text" data-i18n="popup.empty.text"></p>
        <button id="emptyAddBtn" class="btn btn--primary" type="button" data-i18n="popup.empty.action"></button>
    </div>

    <div id="settingsPanel" class="settings-panel" hidden></div>
    <div id="whatsnewPanel" class="settings-panel" hidden></div>

    <footer class="popup-footer">
        <span id="versionLabel" class="popup-footer__version"></span>
        <div id="vaultLang"></div>
    </footer>
</section>

<script type="module" src="popup.js"></script>
</body>
</html>
