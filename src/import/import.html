<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>M2 Authenticator</title>
    <link rel="stylesheet" href="../assets/styles/app.css" />
    <link rel="stylesheet" href="import.css" />
</head>
<body class="page">
<main class="wrap">
    <header class="page-header">
        <div class="page-header__row">
            <h1 data-i18n="import.title"></h1>
            <div id="langSlot"></div>
        </div>
        <p class="page-header__lead" data-i18n="import.lead"></p>
    </header>

    <div id="lockedNotice" class="alert alert--warning" data-i18n="import.locked" hidden></div>

    <div id="workspace" hidden>
        <nav class="tabs" role="tablist">
            <button class="tab tab--active" type="button" data-tab="qr" role="tab" data-i18n="import.tab.qr"></button>
            <button class="tab" type="button" data-tab="manual" role="tab" data-i18n="import.tab.manual"></button>
        </nav>

        <!-- Tab QR -->
        <section id="panelQr" class="panel" role="tabpanel">
            <div id="dropZone" class="dropzone" tabindex="0" role="button">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <path d="M14 14h3v3h-3zM18 18h3v3h-3z" />
                </svg>
                <p class="dropzone__title" data-i18n="import.drop.title"></p>
                <p class="dropzone__hint" data-i18n="import.drop.hint"></p>
                <input id="fileInput" type="file" accept="image/*" multiple hidden />
            </div>

            <details class="howto">
                <summary data-i18n="import.howto.summary"></summary>
                <ol>
                    <li data-i18n="import.howto.step1"></li>
                    <li data-i18n="import.howto.step2"></li>
                    <li data-i18n="import.howto.step3"></li>
                    <li data-i18n="import.howto.step4"></li>
                    <li data-i18n="import.howto.step5"></li>
                </ol>
                <p class="howto__warn" data-i18n="import.howto.warning"></p>
            </details>

            <div id="scanStatus" class="alert" hidden></div>
        </section>

        <!-- Tab nhập tay -->
        <section id="panelManual" class="panel" role="tabpanel" hidden>
            <form id="manualForm" autocomplete="off">
                <div class="grid-2">
                    <label class="field">
                        <span class="field__label" data-i18n="import.manual.issuer"></span>
                        <input id="mIssuer" class="input" type="text" data-i18n-placeholder="import.manual.issuerPlaceholder" />
                    </label>
                    <label class="field">
                        <span class="field__label" data-i18n="import.manual.account"></span>
                        <input id="mAccount" class="input" type="text" data-i18n-placeholder="import.manual.accountPlaceholder" />
                    </label>
                </div>

                <label class="field">
                    <span class="field__label" data-i18n="import.manual.secret"></span>
                    <input id="mSecret" class="input input--mono" type="text" placeholder="JBSWY3DPEHPK3PXP" required />
                    <span class="field__hint" data-i18n="import.manual.secretHint"></span>
                </label>

                <div class="grid-3">
                    <label class="field">
                        <span class="field__label" data-i18n="import.manual.algorithm"></span>
                        <select id="mAlgorithm" class="input">
                            <option value="SHA-1">SHA-1</option>
                            <option value="SHA-256">SHA-256</option>
                            <option value="SHA-512">SHA-512</option>
                        </select>
                    </label>
                    <label class="field">
                        <span class="field__label" data-i18n="import.manual.digits"></span>
                        <select id="mDigits" class="input">
                            <option value="6">6</option>
                            <option value="8">8</option>
                        </select>
                    </label>
                    <label class="field">
                        <span class="field__label" data-i18n="import.manual.period"></span>
                        <input id="mPeriod" class="input" type="number" value="30" min="1" max="300" />
                    </label>
                </div>

                <button class="btn btn--primary" type="submit" data-i18n="import.manual.submit"></button>
            </form>
        </section>

        <!-- Bảng review -->
        <section id="reviewSection" class="review" hidden>
            <div class="review__head">
                <h2 id="reviewTitle" data-i18n="import.review.titleIdle"></h2>
                <div class="review__tools">
                    <button id="selectAllBtn" class="btn btn--sm btn--ghost" type="button" data-i18n="import.review.selectAll"></button>
                    <button id="selectNoneBtn" class="btn btn--sm btn--ghost" type="button" data-i18n="import.review.selectNone"></button>
                </div>
            </div>

            <div id="batchNotice" class="alert alert--info" hidden></div>

            <div id="reviewList" class="review__list"></div>

            <div class="review__footer">
                <span id="reviewSummary" class="review__summary"></span>
                <div class="review__actions">
                    <button id="cancelBtn" class="btn btn--ghost" type="button" data-i18n="common.cancel"></button>
                    <button id="saveBtn" class="btn btn--primary" type="button" data-i18n="import.review.save"></button>
                </div>
            </div>
        </section>
    </div>
</main>

<script type="module" src="import.js"></script>
</body>
</html>
